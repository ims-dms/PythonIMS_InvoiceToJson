version: '3.8'

# Vector Search OCR Invoice Processor - Docker Compose Configuration
# ==================================================================
# This file sets up the complete vector search infrastructure:
# - Qdrant vector database
# - API service (optional, can also be run locally)

services:
  # Qdrant Vector Database
  # ----------------------
  # High-performance vector similarity search engine
  qdrant:
    image: qdrant/qdrant:latest
    container_name: ocr-qdrant
    ports:
      - "6333:6333"  # HTTP API
      - "6334:6334"  # gRPC API
    volumes:
      - qdrant_storage:/qdrant/storage
    environment:
      - QDRANT__SERVICE__HTTP_PORT=6333
      - QDRANT__SERVICE__GRPC_PORT=6334
      - QDRANT__LOG_LEVEL=INFO
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:6333/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Optional: Qdrant Web UI
  # -----------------------
  # Visual interface for exploring vectors
  qdrant-dashboard:
    image: qdrant/qdrant-web-ui:latest
    container_name: ocr-qdrant-ui
    ports:
      - "6335:80"
    environment:
      - QDRANT_URL=http://qdrant:6333
    depends_on:
      - qdrant
    restart: unless-stopped
    profiles:
      - with-ui

  # API Service (Optional - can run locally for development)
  # --------------------------------------------------------
  # Uncomment to containerize the API
  # api:
  #   build:
  #     context: .
  #     dockerfile: Dockerfile
  #   container_name: ocr-api
  #   ports:
  #     - "8000:8000"
  #   environment:
  #     # Qdrant connection
  #     - QDRANT_HOST=qdrant
  #     - QDRANT_PORT=6333
  #     
  #     # Vector search settings
  #     - USE_VECTOR_SEARCH=true
  #     - VECTOR_SEARCH_AUTO_INIT=true
  #     - VECTOR_SEARCH_AUTO_SYNC=false
  #     
  #     # Logging
  #     - LOG_LEVEL=INFO
  #   volumes:
  #     - ./appSetting.txt:/app/appSetting.txt:ro
  #     - ./DBConnection.txt:/app/DBConnection.txt:ro
  #   depends_on:
  #     qdrant:
  #       condition: service_healthy
  #   restart: unless-stopped

volumes:
  qdrant_storage:
    driver: local

networks:
  default:
    name: ocr-network

# Usage:
# ------
# Start Qdrant only:
#   docker-compose up -d qdrant
#
# Start with UI:
#   docker-compose --profile with-ui up -d
#
# View logs:
#   docker-compose logs -f qdrant
#
# Stop:
#   docker-compose down
#
# Remove volumes (WARNING: deletes all vectors):
#   docker-compose down -v
